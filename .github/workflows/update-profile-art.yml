name: atualizar arte do perfil

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia, 00:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: instalar dependências
        run: pip install --quiet fonttools brotli

      - name: gerar heatmap, card de estatísticas e stats.json
        env:
          # PROFILE_TOKEN (opcional): token pessoal para incluir contribuições privadas
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/update_profile_art.py

      - name: salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg stats.json
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "chore: atualiza arte do perfil"
            git push
          fi
